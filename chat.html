<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Support Chat</title>
  
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #0084ff;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2 {
      font-size: 18px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .logout-btn, .login-btn {
      background: white;
      color: #0084ff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .logout-btn:hover, .login-btn:hover {
      background: #e4e6eb;
    }

    .messages-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f9f9f9;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sender {
      align-self: flex-end;
      background: #0084ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.receiver {
      align-self: flex-start;
      background: #e4e6eb;
      color: #050505;
      border-bottom-left-radius: 4px;
    }

    .message-author {
      font-size: 11px;
      margin-bottom: 4px;
      opacity: 0.8;
      font-weight: bold;
    }

    .input-area {
      padding: 12px;
      background: white;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .input-area button {
      background: #0084ff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-overlay {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      gap: 16px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>Student Support Chat</h2>
      <div id="userInfo" class="user-info"></div>
    </div>

    
    <div id="loginSection" class="login-overlay">
      <h3>Welcome to Chat Support</h3>
      <p>စကားပြောရန်အတွက် Google အကောင့်ဖြင့် Login ဝင်ပေးပါခင်ဗျာ။</p>
      <button id="loginBtn" class="login-btn" style="background: #0084ff; color: white;">Sign in with Google (Gmail)</button>
    </div>

    
    <div id="chatSection" style="display: none; flex-direction: column; height: 100%;">
      <div id="messagesBox" class="messages-box"></div>
      
      
      <form id="messageForm" class="input-area">
        <input type="text" id="messageInput" placeholder="စာရိုက်ပါ..." required autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    
    const part1 = "AIzaSy";
    const part2 = "AUOaQp-hOoRV4VkcQmPXmDG2BJN8mvCpk"; 
    const firebaseConfig = {
      apiKey: part1 + part2,
      authDomain: "student-support-chat.firebaseapp.com",
      projectId: "student-support-chat",
      storageBucket: "student-support-chat.firebasestorage.app",
      messagingSenderId: "263950881468", 
      appId: "1:263950881468:web:a807f279b4e1daf80836b9"                           
    };

    
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    
    const loginSection = document.getElementById('loginSection');
    const chatSection = document.getElementById('chatSection');
    const loginBtn = document.getElementById('loginBtn');
    const userInfo = document.getElementById('userInfo');
    const messagesBox = document.getElementById('messagesBox');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');

    let currentUser = null;

    
    loginBtn.onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    };

    
    auth.getRedirectResult().catch((error) => {
      console.error("Login Redirect Error:", error);
    });

    
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        loginSection.style.display = 'none';
        chatSection.style.display = 'flex';
        
        userInfo.innerHTML = `
          <span>${user.displayName}</span>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        `;

        document.getElementById('logoutBtn').onclick = () => auth.signOut();

        
        loadMessages();
      } else {
        currentUser = null;
        loginSection.style.display = 'flex';
        chatSection.style.display = 'none';
        userInfo.innerHTML = '';
        messagesBox.innerHTML = '';
      }
    });

   
    
    messageForm.onsubmit = (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text && currentUser) {
        db.ref('messages').push({
          uid: currentUser.uid,
          name: currentUser.displayName || 'Anonymous',
          text: text,
          timestamp: Date.now()
        });
        messageInput.value = '';
      }
    };

    
    function loadMessages() {
      db.ref('messages').limitToLast(50).on('value', (snapshot) => {
        messagesBox.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach((msg) => {
            const isSender = msg.uid === currentUser.uid;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSender ? 'sender' : 'receiver'}`;
            
            messageDiv.innerHTML = `
              <div class="message-author">${isSender ? 'You' : msg.name}</div>
              <div>${escapeHtml(msg.text)}</div>
            `;
            messagesBox.appendChild(messageDiv);
          });
          
          messagesBox.scrollTop = messagesBox.scrollHeight;
        }
      });
    }

    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
