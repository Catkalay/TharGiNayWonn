    <style>
        body {
            cursor: url('logo sword 3d.png'), auto;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            margin: 0;
            padding: 0;
            background-color: #e9e197;
        }

        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5px;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            margin-bottom: 5px;
            box-sizing: border-box;
        }

        .header img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
            display: block;
            border-radius: 3px;
        }

       
        .content-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch; 
            width: 100%;
            box-sizing: border-box;
            gap: 5px;
        }

        .left-sidebar {
            flex: 0 0 26%;
            max-width: 26%;
            background-color: #530000;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
            overflow: hidden;
        }

        .main-content {
            flex: 0 0 46%;
            max-width: 46%;
            background-color: transparent; 
            padding: 0 5px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .right-sidebar {
            flex: 0 0 26%;
            max-width: 26%;
            background-color: #530000;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
            overflow: hidden;
        }

        .footer {
            width: 100%;
            margin-top: 5px;
            background-color: #070707;
            box-sizing: border-box;
            clear: both;
        }

        img, video {
            max-width: 100%;
            height: auto;
            box-sizing: border-box;
        }

        .right-sidebar h2 {
            font-size: 18px;
            margin: 0;
            padding: 0;
        }

        .right-sidebar h2 p {
            margin: 8px 0;
        }

        .right-sidebar h2 a {
            text-decoration: none;
            color: #007bff;
            display: block;
            padding: 6px 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .right-sidebar h2 a:hover {
            background: #e0e0e0;
        }

        #myBtn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 30px;
            z-index: 99;
            font-size: 18px;
            border: none;
            outline: none;
            background-color: red;
            color: rgb(255, 251, 0);
            cursor: pointer;
            padding: 15px;
            border-radius: 4px;
        }
        #myBtn:hover {
            background-color: #0a72a1;
        }

        .rainbow-text {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(
                270deg,
                red, orange, yellow, green, blue, indigo, violet, red
            );
            background-size: 1000% 1000%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 8s ease infinite;
            -webkit-text-stroke: 0.8px white;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.8));
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <div class="content-container">

                <div style="margin-top: 12px; font-size: 16px; font-weight: bold; color: #ffe713;">

                </div>
                <script>
                  (function() {
                    let count = localStorage.getItem('page_view_count') || 0;
                    count = parseInt(count) + 1;
                    localStorage.setItem('page_view_count', count);
                    
                    fetch('https://api.counterapi.dev/v1/tharginaywonn-catkalay/video-view/up')
                      .then(res => res.json())
                      .then(data => {
                        if(data && data.count) {
                          document.getElementById('visits').innerText = data.count;
                        } else {
                          document.getElementById('visits').innerText = count;
                        }
                      })
                      .catch(err => {
                        document.getElementById('visits').innerText = count;
                      });
                  })();
                </script>

                <div style="margin-top: 15px; text-align: center;">
                  <a href="http://s01.flagcounter.com/more/FqA"><img src="https://s01.flagcounter.com/count2/FqA/bg_D4D4D4/txt_000000/border_CCCCCC/columns_3/maxflags_18/viewers_0/labels_0/pageviews_0/flags_0/percent_0/" alt="Flag Counter" border="0"></a>
                </div>
            </aside>
           
            
            <main class="main-content">
                <marquee>
                    <h1 style="color:Tomato;">" မင်္ဂလာပါ "
                        <span style="color:DodgerBlue;">***** ဝင်ရောက်ကြည့်ရှုပေးလို့
                        <span style="color:MediumSeaGreen;">ကျေးဇူးအများကြီး 
                        <span style="color:rgb(86, 60, 179);">တင်ပါတယ် *****</span>
                        </span>
                        </span>
                    </h1>
                </marquee>
                
                <center>
                    <h1>သာကီနေဝဏ်းသိုင်း (ပင်မ)</h1>
                    <h1>Thar Gi Nay Wonn</h1>
                </center>
                
                <h2>CONTACT</h2>
                <center>
                    <h3>Coming Soon</h3>
                </center>
            </main>
            
            <aside class="right-sidebar">
                <h2>
                    <p><a href="index.html">Home</a></p>
                    <p><a href="category.html">Category</a></p>
                    <p><a href="course.html">Course</a></p>
                    <p><a href="about.html">About</a></p>
                    <p><a href="contact.html">Contact</a></p>
                </h2>
            </aside>

        </div>

        <footer class="footer">
            <marquee><h3 class="rainbow-text">***** SMART Group မှ တည်ဆောက်သည် *****</h3></marquee>
        </footer>
    </div>

    <button onclick="topFunction()" id="myBtn" title="Go to top">အပေါ်သို့</button>

    <script>
        let mybutton = document.getElementById("myBtn");
        window.onscroll = function() {scrollFunction()};

        function scrollFunction() {
          if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            mybutton.style.display = "block";
          } else {
            mybutton.style.display = "none";
          }
        }

        function topFunction() {
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
        }
    </script>

</body>
</html>
